spring.application.name=authentication
server.port=${PORT:8080}

# Reactive Postgres (AWS RDS)
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/authdb}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=${DB_POOL_MAX_SIZE:20}

# Flyway migrations against the same Postgres instance
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_JDBC_URL:jdbc:postgresql://localhost:5432/authdb}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}
spring.flyway.locations=classpath:db/migration

# JWT
security.jwt.secret=${JWT_SECRET:change-me-with-at-least-32-characters-secret}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:agroventa-auth-service}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
