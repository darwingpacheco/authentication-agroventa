name: 4. Deploy to ECS Fargate

on:
  workflow_run:
    workflows: ["3. Build & Publish to ECR"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-ecs:
    name: Deploy Image to Fargate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Active Task Definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_SERVICE_AUTH }} \
            --query taskDefinition > task-definition.json

      - name: Update Container Image Tag in Task Definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: authentication
          image: ${{ secrets.ECR_REGISTRY_HOST }}/${{ secrets.ECR_REPOSITORY_AUTH }}:latest

      - name: Deploy Rendered Task Definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_AUTH }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true